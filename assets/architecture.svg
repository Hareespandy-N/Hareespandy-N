<text x="600" y="64" font-size="13" fill="#96b7c9">Conceptual architecture · interfaces and feedback must be validated per installation</text>
<rect x="355" y="87" width="490" height="71" rx="14" fill="#173f56" stroke="#5ac4e5" stroke-width="2"/><text x="600" y="118" font-size="22" font-weight="700" fill="#f4fdff">SCADA / HMI / PRODUCTION IT</text><text x="600" y="144" font-size="16" fill="#c1dfeb">Monitoring · Scheduling · Alarms · Traceability</text>
