<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="485" viewBox="0 0 1200 485" role="img" aria-labelledby="tt dd">
<title id="tt">Reference industrial robotics integration architecture</title><desc id="dd">Conceptual architecture showing HMI and SCADA feeding production coordination, PLC and API interfaces, then AMR, ASRS, cobots and industrial equipment. This is a generic educational pattern, not a customer deployment.</desc>
